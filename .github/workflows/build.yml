name: Build

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build nMIDIEditor.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test tests/nMIDIEditor.Tests.csproj -c Release -warnaserror

      - name: Publish
        run: dotnet publish nMIDIEditor.csproj -c Release -r win-x64 --self-contained false -o publish/nMIDIEditor

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/nMIDIEditor/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, CHANGELOG.md publish/nMIDIEditor/
          $version = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}'.TrimStart('v', 'V') } else { 'dev' }
          Compress-Archive -Path publish/nMIDIEditor -DestinationPath "publish/nMIDIEditor-$version-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nMIDIEditor-win-x64
          path: publish/*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: publish/*.zip
