name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build nMIDIEditor.csproj -c Release

      - name: Test
        run: dotnet test tests/nMIDIEditor.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish nMIDIEditor.csproj -c Release -r win-x64 --self-contained false -o publish/nMIDIEditor

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/nMIDIEditor/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, CHANGELOG.md publish/nMIDIEditor/
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          Compress-Archive -Path publish/nMIDIEditor -DestinationPath "publish/nMIDIEditor-$version-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nMIDIEditor-win-x64
          path: publish/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.zip
          body_path: docs/release-notes.md
